services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "1000:1000"              # cambia a tu UID:GID real (id -u / id -g)
    ports:
      - "4533:4533"
    environment:
      ND_SCANNER_SCHEDULE: "@every 1h"
      ND_SCANNER_IGNOREDOTFOLDERS: "true"
      ND_LOGLEVEL: "info"
      ND_SESSIONTIMEOUT: "240h"
      ND_BASEURL: "https://music.permuy.org"
      ND_PLUGINS_ENABLED: "true"
      ND_PLUGINS_AUTORELOAD: "false"
      ND_BACKUP_PATH: "/data/backup"
      ND_BACKUP_SCHEDULE: "@every 24h"
      ND_BACKUP_COUNT: 7
    volumes:
      - ./data:/data
      - /home/apermuy/Música:/music:ro
    restart: unless-stopped

  nfs-server:
    image: itsthenetwork/nfs-server-alpine:latest
    container_name: nfs-music
    privileged: true               # requerido: NFS necesita acceso a módulos del kernel del host
    environment:
      SHARED_DIRECTORY: /music
      READ_ONLY: "true"            # exporta en modo ro, coherente con el bind mount de abajo
      SYNC: "true"                 # escrituras síncronas (n/a aquí al ser ro, pero explícito)
      PERMITTED: "192.168.1.50"    # IP de tu equipo cliente; cambia por la real, o usa "192.168.1.*" para el rango
    volumes:
      - /home/apermuy/Música:/music:ro
    ports:
      - "2049:2049"
    restart: unless-stopped

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    ports:
      - "80:80"       # HTTP — necesario para el reto ACME/Let's Encrypt
      - "443:443"     # HTTPS
      - "81:81"       # panel de administración web de NPM
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    restart: unless-stopped